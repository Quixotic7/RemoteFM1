# RemoteFM1's build settings for fm1-base's tools/build.py (run through ../build.sh: fm1-base, patched, in
# firmware/build/base; firmware/patches/)
name = "RemoteFM1"             # the build's files: build/remotefm1.fwsc, remotefm1-usb.fwsc (--no-ble)
id_prefix = "FM-1_72"          # package identity: dev FM-1_7200, releases FM-1_72XXYYZZ (72: "r"), since 0.3.7.
                               # 0.2 to 0.3.6 were FM-1_52 (52: "R", as RemoteFM1's SysEx 7D 52 46): QUADRO numbers
                               # its releases FM-1_52XXYYZZ too. FIZZ is FM-1_46, CTL-1 FM-1_6, Radio FM-1_13, the
                               # template FM-1_11
usb_product = "FM-1"           # the USB product name as RemoteFM1 0.1 had it (the manufacturer: felucca-bsp's own,
                               # "Hügelton Instruments", as 0.1): the same descriptors, so hosts see the same device
include = ["src"]              # the protocol layer, the decoder and the push (src/: host/ compiles them too)
o2 = ["sa/sa_synth.c"]         # the standalone DX7 (saadet's FM6 in third_party/saadet-fm6, STANDALONE-PLAN.md), -O2
gen = ["tools/gen_fm6_tables.py --out {gen}/fm6_tables.h",   # FM6's tables, from MSFA's formulas
       "tools/gen_sa_config.py --out {gen}/sa_config.h",     # SA_BENCH=1 (./build.sh --bench): the bench build
       "tools/gen_pixfont.py --out {gen}/sa_font.h",         # the screens' pixel font (Jersey 10, OFL: third_party/)
       "tools/gen_dx7_rom.py --out {gen}/dx7_rom.h"]         # Yamaha's ROM cartridges from the owner's .syx files
                               # (DX7_ROM_DIR, else Presets/DX7-ROM beside the checkout; never committed: without them
                               # the INIT VOICE only)
vendored = ["third_party/"]    # (other people's code: the register check leaves it)
# the second core (fm1-base's cpu2: felucca-bsp's chip/fm1_cpu1.*), FIZZ's settings (FIZZ firmware/fm1.toml, P2.14):
# started in app_init, core 1 renders about half the DX7's voices each control block (sa/sa_synth.c, the batch); a
# unit whose second core fails plays on with one, barred until power-off. FM1B_CPU2=0 ./build.sh: one core
cpu2 = true
cpu2_fallback = true
words = "words.tsv"
ble = true                     # Bluetooth MIDI with a computer or tablet (--no-ble: the USB-only package)
# Bluetooth's radio (patch 0003; measured on an FM-1 with a Mac, 2026-10-27, 1 KB SysEx frames: 6 KB/s stock,
# 12.5 KB/s with MTU 247 alone, 35-38 KB/s with these four; macOS took 2M, 130-byte link packets and 7.5 ms)
ble_dle = true
ble_2m = true
ble_rx_bufs = 16
ble_fast_interval = true
usb_audio_in = true            # USB audio (0.2.1): the computer sees the FM-1 as a sound output and plays through
usb_audio_out = true           # its speaker / headphones, MASTER its volume (fm1-base builds the output only with the
                               # input: the FM-1 is recordable too). Interfaces: 0 audio control, 1 MIDI, 2 audio in,
                               # 3 audio out, 4 the vendor bulk pair (src/rfm_dev.c; 2 in 0.1 / 0.2.0); bcdDevice 4.50
usb_midi_last = false          # that order kept: fm1-base's default since 2026-10-31 puts MIDI after the audio streams
                               # (FELUCCA_UAC_MIDI_LAST, for macOS 13-15), which renumbers the interfaces and makes
                               # bcdDevice 4.D0; not tried with the vendor interface on an FM-1 yet
usb_host = true                # USB HOST (README.md "USB Host"): the standalone's settings make the port the host of a
                               # USB-MIDI keyboard or synth (felucca-bsp's chip/usb_host.c); never saved: every boot
                               # is a device. The FM-1's only: build.sh turns it off for the SMK-37 (FM1B_USB_HOST=0)
# the site (fm1-base's make_site.py is not used: RemoteFM1 has its own, web/)
tagline = "the FM-1 as a DX7 of its own, and as the panel of a firmware on a computer"
repo = "https://github.com/Quixotic7/RemoteFM1"
licence = "MPL-2.0"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments)."
# firmware.json for firmware hubs (fm1-base docs/FIRMWARE-JSON.md; a --release build refuses without these): taken
# from fmhub.json, The Firmware Hub card's own text and picture
author = "Quixotic7"
description = "A DX7 on your FM-1: Yamaha's 256 ROM voices and your own cartridges, with arp, scales, latch and a 16-loop looper. A MIDI controller over USB, Bluetooth and TRS. And the FM-1 as keys, knobs and screen for the RemoteFM1 apps on the web, iOS and Android, which run over 150 FM-1 firmwares."
tags = ["synth", "fm", "controller", "midi"]
install = "https://remotefm1.com/installer/"
screenshot = "docs/hub-card.png"   # (a path in the repository: build.sh's FM1B_REPO_ROOT)
