# SPDX-License-Identifier: GPL-3.0-only
# The site on GitHub Pages (WEB-PLAN.md section 4): the FM-1 player (web/site), its engines, Use my FM-1, and the
# RemoteFM1 installer (web/installer). Pages must be turned on once by the owner: Settings > Pages > Source: GitHub
# Actions. Until then the deploy job fails harmlessly; this file enables nothing.
#
# The published tree (what web/site/tools/build_catalog.mjs --layout pages expects):
#   index.html css/ js/ worklet/ mock/ fonts/ catalog.json      the player (web/site)
#   engines/native/engine.js + <core>.wasm                       W1 (needs the FM1VST submodule at web/vendor/FM1VST)
#   engines/emu/engine.js catalog.mjs fm1_web.wasm LICENSE-fm1-emu.txt   W2 (needs web/vendor/fm1-emu)
#   remote/remote.js, build/remote/remotefm1.mjs                 W4 (Use my FM-1)
#   installer/                                                   the RemoteFM1 installer and its package
#   managers/<id>/ fm1-shim.js index.json                         the firmwares' own managers, hosted (web/managers; FM1VST's core trees)
#   engines/native/ext/<id>/<version>/                           firmware authors' own native builds, checked (web/site/tools/native_sync.mjs)
#   native/                                                      how authors publish one (web/site/native, docs/NATIVE-AUTHORS.md)
# A part whose sources are missing is skipped: the page then falls back to its test engine for that engine, or keeps
# the Use my FM-1 stub.
#
# Nightly (schedule): the Hub deletes a firmware's old package when it releases a new version, and the page follows it
# live anyway (web/site/js/live.js); the nightly run rebuilds the catalog from the Hub, reports every native core
# behind the Hub (the job summary, and ::warning annotations: readable through the public check-runs API), and
# deploys only when the commit or the catalog differ from the deployed site's deployed.json. A Hub outage never fails
# it: the catalog falls back to the snapshot in the tree, and a scheduled run then keeps the deployed site.
# Authors' native builds (docs/NATIVE-AUTHORS.md): both jobs run web/site/tools/native_sync.mjs (the attestation, the
# manifest, the imports, the size, the gate, a smoke test in Node), so a new author release changes the check job's
# catalog as it will the deployed one; the build job also copies the accepted modules into engines/native/ext/.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  attestations: read          # gh attestation verify (authors' native builds)

concurrency:
  group: pages
  cancel-in-progress: true

env:
  EMSDK_VERSION: "6.0.11"     # the version the engines were built and tested with locally (~/emsdk)

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.report.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authors' native builds (checked, not published here)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node web/site/tools/native_sync.mjs --index _check/native-ext.json --work _check/native-work

      - name: The Hub's releases (native cores behind it), and whether to deploy
        id: report
        run: |
          mkdir -p _check
          ext=()
          if [ -f _check/native-ext.json ]; then ext=(--native-ext _check/native-ext.json); fi
          # the Hub's live catalog, else the snapshot in the tree (a Hub outage does not fail the run)
          node web/site/tools/build_catalog.mjs --layout pages --hub https://thefirmwarehub.com/catalog.json --out _check/catalog.json "${ext[@]}" \
            || node web/site/tools/build_catalog.mjs --layout pages --out _check/catalog.json "${ext[@]}"
          node web/site/tools/release_report.mjs --catalog _check/catalog.json --commit "${{ github.sha }}" --event "${{ github.event_name }}" \
            --site "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

  build:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests (the site's logic, the installer against a simulated FM-1)
        run: |
          node web/site/test.mjs
          node web/site/test-wav.mjs
          node web/installer/test_installer.mjs
          node web/managers/test.mjs

      - name: Which parts can be built
        id: parts
        run: |
          echo "native=$([ -f web/vendor/FM1VST/CMakeLists.txt ] && [ -f web/engines/native/build.sh ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          echo "emu=$([ -f web/vendor/fm1-emu/Cargo.toml ] && [ -f web/engines/emu/build.sh ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          echo "remote=$([ -f web/remote/build.sh ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Emscripten
        if: steps.parts.outputs.native == '1' || steps.parts.outputs.remote == '1'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - uses: actions/setup-python@v5          # Ubuntu's own python3 refuses pip installs (PEP 668)
        if: steps.parts.outputs.native == '1'
        with:
          python-version: "3.12"

      - name: Native cores (W1), FM1VST's 21 un-gated cores in WebAssembly
        id: native
        if: steps.parts.outputs.native == '1'
        continue-on-error: true                  # a failed engine leaves the site up with its fallback
        env:
          FM1VST_DIR: ${{ github.workspace }}/web/vendor/FM1VST
        run: |
          set -x
          sudo apt-get update && sudo apt-get install -y cmake rsync libraqm0 libfribidi0
          python -m pip install --upgrade pillow fonttools numpy
          python -c "from PIL import features; print('raqm', features.check('raqm'))"
          export CR_PYTHON="$(command -v python)"
          .github/scripts/logged.sh native bash web/engines/native/build.sh
          mkdir -p _site/engines/native
          cp web/engines/native/engine.js _site/engines/native/
          cp web/build/native/*.wasm _site/engines/native/

      - name: Emulated engine (W2), fm1-emu's web crate
        id: emu
        if: steps.parts.outputs.emu == '1'
        continue-on-error: true
        run: |
          rustup target add wasm32-unknown-unknown
          mkdir -p _site/engines/emu
          .github/scripts/logged.sh emu bash web/engines/emu/build.sh "$PWD/_site/engines/emu"
          cp web/engines/emu/engine.js web/engines/emu/catalog.mjs _site/engines/emu/
          cp web/vendor/fm1-emu/LICENSE _site/engines/emu/LICENSE-fm1-emu.txt

      - name: Use my FM-1 (W4), libremotefm1 in WebAssembly
        id: remote
        if: steps.parts.outputs.remote == '1'
        continue-on-error: true
        run: |
          .github/scripts/logged.sh remote bash web/remote/build.sh
          mkdir -p _site/remote _site/build/remote
          cp web/remote/remote.js _site/remote/
          cp web/build/remote/remotefm1.mjs _site/build/remote/

      - name: Authors' native builds (docs/NATIVE-AUTHORS.md), checked and copied to engines/native/ext/
        id: authors
        continue-on-error: true                  # (a failure leaves FM1VST's cores and the emulated engine as they are)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/engines/native/ext
          .github/scripts/logged.sh authors node web/site/tools/native_sync.mjs --mirror _site/engines/native/ext --index web/build/native-ext/index.json

      - name: The player and the installer
        run: |
          mkdir -p _site
          cp -R web/site/index.html web/site/css web/site/js web/site/worklet web/site/mock web/site/fonts web/site/native _site/
          ext=()
          if [ -f web/build/native-ext/index.json ]; then ext=(--native-ext web/build/native-ext/index.json); fi
          # the catalog: the Hub's live one, else the snapshot in the tree
          node web/site/tools/build_catalog.mjs --layout pages --hub https://thefirmwarehub.com/catalog.json --out _site/catalog.json "${ext[@]}" \
            || node web/site/tools/build_catalog.mjs --layout pages --out _site/catalog.json "${ext[@]}"
          mkdir -p _site/installer
          cp -R web/installer/index.html web/installer/installer.js web/installer/fm1ota.js web/installer/fm1pkg.js \
                web/installer/releases.json web/installer/firmware _site/installer/
          # the package the page installs is the one its release list names
          (cd _site/installer/firmware && sha256sum -c SHA256SUMS)
          # RemoteFM1 in the player: its package is the catalog's only same-origin one; it must be published
          node -e 'const c=require("./_site/catalog.json");for(const f of c.firmwares)if(f.emu&&f.emu.from==="site"&&!require("fs").existsSync("_site/"+f.emu.pkg)){console.error("missing _site/"+f.emu.pkg);process.exit(1)}'
          # the firmwares' own managers / editors (web/managers/build.mjs), copied from FM1VST's core trees at the commit it
          # pins, each with its licence, its source link and the player's Web MIDI shim; none of theirs is in this repo
          node web/managers/build.mjs --cores web/vendor/FM1VST/cores --out _site/managers
          # what is deployed: the commit and the catalog's hash (the nightly run compares them: release_report.mjs)
          node web/site/tools/release_report.mjs --catalog _site/catalog.json --stamp _site/deployed.json --commit "${{ github.sha }}"
          touch _site/.nojekyll
          find _site -type f | sort
          # no raw preset source is published: ChoralRoot's and Melodee's CZ-1 / Prophet-5 presets go out compiled
          # into their .wasm only (no .syx, no cz1-factory / prophet5-factory file, no file or byte run of a .syx)
          node web/site/tools/no_raw_presets.mjs _site --cores web/vendor/FM1VST/cores

      - name: What was built
        run: |
          for p in "native ${{ steps.native.outcome }}" "emu ${{ steps.emu.outcome }}" "remote ${{ steps.remote.outcome }}" "authors ${{ steps.authors.outcome }}"; do
            set -- $p
            echo "$1: $2" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$2" = failure ]; then echo "::warning title=$1 engine not published::the $1 build failed; the site falls back without it"; fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
