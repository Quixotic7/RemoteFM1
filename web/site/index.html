<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* AudioWorklet and Web MIDI need a secure page: http -> https (not on a local server) */ if (location.protocol === "http:" && !/^(localhost|127\.|\[::1\]|.*\.localhost$)/.test(location.hostname)) location.replace("https:" + location.href.slice(5));</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FM-1 Player</title>
<meta name="description" content="Play FM-1 firmwares in the browser: the M-VAVE FM-1 drawn on screen, played with the computer keyboard, mouse, touch or a MIDI keyboard. Install RemoteFM1 to use your own FM-1 as the panel.">
<meta name="theme-color" content="#0F1113">
<link rel="preload" href="fonts/InterTight-VF-latin.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<header id="top">
  <button id="menu-btn" class="brand" aria-label="Settings"><span class="mark"></span><b>FM-1 Player</b></button>
  <button id="fw-btn" class="fw-pill" title="Pick a firmware"><span id="fw-name"></span><span id="fw-ver"></span>
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
  <a id="fw-src" class="src-link" target="_blank" rel="noopener" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5M9 3 7 13"/></svg><span class="src-text">Source</span><span class="src-arrow" aria-hidden="true">&#8599;</span></a>
  <button id="ed-btn" class="src-link ed-btn" aria-controls="ed-panel" aria-expanded="false" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h10"/><circle cx="6" cy="4.5" r="1.4"/><circle cx="10.5" cy="8" r="1.4"/><circle cx="5" cy="11.5" r="1.4"/></svg><span class="src-text">Editor</span></button>
  <div id="rec" class="rec" hidden>
    <button id="rec-btn" class="rec-btn" aria-pressed="false" aria-label="Record" title="Record (Shift+R)"><span class="rec-dot"></span></button>
    <span id="rec-time" class="rec-time" hidden>0:00</span>
    <span id="rec-meter" class="rec-meter" aria-hidden="true" hidden><i></i><i></i></span>
    <button id="takes-btn" class="takes-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="takes" hidden><span class="takes-label">Takes</span><b id="takes-n">0</b></button>
  </div>
  <span id="status" role="status"></span>
  <nav>
    <button id="fm1-btn" class="fm1-btn" aria-haspopup="dialog" aria-expanded="false" hidden><span class="fm1-dot off"></span><span class="fm1-label">Connect FM-1</span><span class="fm1-short">FM-1</span><span class="fm1-via" hidden></span></button>
    <a id="install-link" href="../installer/" title="Install RemoteFM1 on your FM-1">Install<span class="long"> RemoteFM1</span></a>
    <a id="vst-link" href="https://github.com/Quixotic7/FM1VST/releases/latest" target="_blank" rel="noopener" title="FM1VST: these firmwares as a VST3 / AU plugin and a desktop app for Mac (Apple silicon)">Get FM1VST</a>
    <a id="site-src" href="https://github.com/Quixotic7/RemoteFM1" target="_blank" rel="noopener" title="RemoteFM1 (this site and the FM-1 Player) on GitHub">Site source</a>
  </nav>
</header>
<main id="stage" tabindex="-1">
  <div id="screen-wrap" hidden><canvas id="screen" aria-label="The FM-1's screen"></canvas></div>
  <div id="device-wrap"><canvas id="device" aria-label="The FM-1: click or touch its keys, buttons and knobs"></canvas></div>
  <button id="corner" aria-label="Settings" title="Settings"></button>
  <div id="start" hidden>
    <div class="start-row">
      <button id="start-btn"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6L12.6 8z"/></svg><span>Play <b id="start-name"></b></span></button>
      <button id="start-fm1" class="start-fm1" hidden><span class="fm1-dot off"></span><span>Play on my FM-1</span></button>
    </div>
    <p id="start-fm1-note" class="start-note" hidden></p>
    <p>Sound starts with a click. Keys: <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd> <kbd>G</kbd> <kbd>H</kbd> <kbd>J</kbd> <kbd>K</kbd> <kbd>L</kbd> &hellip; &middot; <kbd>Z</kbd> <kbd>X</kbd> octave.</p>
  </div>
  <div id="offer" class="offer" role="alertdialog" aria-labelledby="offer-text" hidden>
    <span id="offer-text"></span>
    <span class="offer-btns"><button id="offer-yes" class="pill primary">Bring it</button><button id="offer-no" class="pill ghost">Start fresh</button></span>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>
<div id="takes" class="takes-pop" role="dialog" aria-label="Takes" hidden></div>
<span id="rec-live" class="sr-only" aria-live="polite"></span>
<aside id="ed-panel" class="ed-panel" aria-label="The firmware's editor" hidden>
  <div class="ed-head"><span id="ed-dot" class="fm1-dot off"></span><b id="ed-title">Editor</b><span id="ed-sub" class="ed-sub"></span>
    <a id="ed-src" class="ed-src" target="_blank" rel="noopener" hidden>Editor source</a><button id="ed-pop" class="pill ed-pop">Pop out &#8599;</button>
    <button id="ed-close" class="icon-btn" aria-label="Close the editor" title="Close the editor"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
  <div id="ed-body" class="ed-body"></div>
</aside>
<noscript><p style="color:#ddd;padding:24px">The FM-1 Player needs JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
