<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FM-1 Player</title>
<meta name="description" content="Play FM-1 firmwares in the browser: the M-VAVE FM-1 drawn on screen, played with the computer keyboard, mouse, touch or a MIDI keyboard. Install RemoteFM1 to use your own FM-1 as the panel.">
<meta name="theme-color" content="#0F1113">
<link rel="preload" href="fonts/InterTight-VF-latin.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<header id="top">
  <button id="menu-btn" class="brand" aria-label="Settings"><span class="mark"></span><b>FM-1 Player</b></button>
  <button id="fw-btn" class="fw-pill" title="Pick a firmware"><span id="fw-name"></span><span id="fw-ver"></span>
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
  <span id="status" role="status"></span>
  <nav>
    <a id="install-link" href="../installer/">Install RemoteFM1</a>
    <a href="https://github.com/Quixotic7/RemoteFM1" target="_blank" rel="noopener">Source</a>
  </nav>
</header>
<main id="stage" tabindex="-1">
  <div id="screen-wrap" hidden><canvas id="screen" aria-label="The FM-1's screen"></canvas></div>
  <div id="device-wrap"><canvas id="device" aria-label="The FM-1: click or touch its keys, buttons and knobs"></canvas></div>
  <button id="corner" aria-label="Settings" title="Settings"></button>
  <div id="start" hidden>
    <button id="start-btn"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6L12.6 8z"/></svg><span>Play <b id="start-name"></b></span></button>
    <p>Sound starts with a click. Then the keys: <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd> &hellip; <kbd>Z</kbd> <kbd>X</kbd> octave.</p>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>
<noscript><p style="color:#ddd;padding:24px">The FM-1 Player needs JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
