<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arp settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.px{clip-path:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px))}
.lcd{position:absolute;left:0;top:0;width:480px;height:480px;pointer-events:none;background-image:linear-gradient(rgba(0,0,0,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.2) 1px,transparent 1px);background-size:4px 4px}
@keyframes nudgeL{0%,49%{transform:translateX(0)}50%,100%{transform:translateX(-4px)}}
@keyframes nudgeR{0%,49%{transform:translateX(0)}50%,100%{transform:translateX(4px)}}
.al{animation:nudgeL .6s steps(1) infinite}
.ar{animation:nudgeR .6s steps(1) infinite}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; background: #000000; font-family: 'Jersey 10', monospace; color: #f4f4f4; overflow: hidden; -webkit-font-smoothing: none; font-synthesis: none">
  <div class="px" style="position: absolute; left: 20px; top: 16px; padding: 8px 14px 6px; background: #a7f070; color: #000000; font-size: 32px; font-weight: 700; line-height: 1">ARP</div>
  <div class="px" style="position: absolute; right: 20px; top: 16px; padding: 8px 14px 6px; background: #333c57; font-size: 32px; font-weight: 700; line-height: 1">120 BPM</div>
  <div class="px" style="position: absolute; left: 0; right: 0; margin: 0 auto; width: 110px; top: 80px; padding: 8px 0 6px; text-align: center; background: #ef7d57; color: #000000; font-size: 32px; font-weight: 700; line-height: 1">RATE</div>
  <svg class="al" width="30" height="54" viewBox="0 0 30 54" shape-rendering="crispEdges" style="position: absolute; left: 20px; top: 160px" aria-hidden="true"><g transform="translate(30 0) scale(-1 1)"><path d="{{arrow.a}}" fill="#ef7d57"></path></g></svg>
  <div style="position: absolute; left: 0; right: 0; top: 136px; text-align: center; font-size: 108px; font-weight: 700; line-height: 1; text-shadow: 8px 8px 0 #29366f">1/16</div>
  <svg class="ar" width="30" height="54" viewBox="0 0 30 54" shape-rendering="crispEdges" style="position: absolute; right: 20px; top: 160px" aria-hidden="true"><path d="{{arrow.a}}" fill="#ef7d57"></path></svg>
  <div style="position: absolute; left: 0; right: 0; top: 262px; display: flex; justify-content: center; gap: 40px; font-size: 26px; font-weight: 700; color: #566c86">
    <span>1/8</span><span>1/32</span>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="4">
      <div class="px" style="position: relative; height: 92px; background: {{c.color}}">
        <div class="px" style="position: absolute; left: 4px; top: 4px; right: 4px; bottom: 4px; background: {{c.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
          <div style="font-size: 26px; font-weight: 700; line-height: 1; color: {{c.lab}}">{{c.label}}</div>
          <div style="font-size: 26px; font-weight: 700; line-height: 1; color: {{c.fg}}">{{c.value}}</div>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const spr = (rows, s) => { const o = {}; rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) { const c = r[x]; if (c === '.') continue; o[c] = (o[c] || '') + 'M' + x * s + ' ' + y * s + 'h' + s + 'v' + s + 'h-' + s + 'z'; } }); return o; };
    const arrow = spr(['a....', 'aa...', 'aaa..', 'aaaa.', 'aaaaa', 'aaaa.', 'aaa..', 'aa...', 'a....'], 6);
    const cell = (label, value, color, on) => on
      ? { label, value, color, bg: color, lab: '#000000', fg: '#000000' }
      : { label, value, color, bg: '#000000', lab: color, fg: '#f4f4f4' };
    const cells = [cell('MODE', 'UP', '#41a6f6'), cell('RATE', '1/16', '#ef7d57', true), cell('OCT', '2', '#ffcd75'), cell('GATE', '60%', '#a7f070')];
    return { arrow, cells };
  }
}
</script>
</body>
</html>
