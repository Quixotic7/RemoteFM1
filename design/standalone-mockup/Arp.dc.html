<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arp on</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.px{clip-path:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px))}
.lcd{position:absolute;left:0;top:0;width:480px;height:480px;pointer-events:none;background-image:linear-gradient(rgba(0,0,0,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.2) 1px,transparent 1px);background-size:4px 4px}
@keyframes lit{0%,12.4%{background:#a7f070}12.5%,100%{background:#257179}}
.st{animation:lit 1.6s steps(1) infinite}
@keyframes hop{0%{left:46px;top:376px}12.5%{left:98px;top:352px}25%{left:150px;top:328px}37.5%{left:202px;top:304px}50%{left:254px;top:376px}62.5%{left:306px;top:352px}75%{left:358px;top:328px}87.5%{left:410px;top:304px}100%{left:46px;top:376px}}
.ball{animation:hop 1.6s steps(1) infinite}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; background: #000000; font-family: 'Jersey 10', monospace; color: #f4f4f4; overflow: hidden; -webkit-font-smoothing: none; font-synthesis: none">
  <div class="px" style="position: absolute; left: 20px; top: 16px; padding: 8px 14px 6px; background: #a7f070; color: #000000; font-size: 32px; font-weight: 700; line-height: 1">ARP</div>
  <div class="px" style="position: absolute; right: 20px; top: 16px; padding: 8px 14px 6px; background: #333c57; font-size: 32px; font-weight: 700; line-height: 1">120</div>
  <div style="position: absolute; left: 0; right: 0; top: 84px; text-align: center; font-size: 168px; font-weight: 700; line-height: 1; text-shadow: 8px 8px 0 #257179">UP</div>
  <sc-for list="{{steps}}" as="s" hint-placeholder-count="8">
    <div class="st" style="position: absolute; {{s.st}} width: 44px; background: #257179; animation-delay: {{s.d}}s"></div>
  </sc-for>
  <div class="px ball" style="position: absolute; left: 46px; top: 376px; width: 24px; height: 24px; background: #ffcd75"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const hs = [32, 56, 80, 104, 32, 56, 80, 104];
    const steps = hs.map((h, i) => ({ st: 'left: ' + (36 + i * 52) + 'px; top: ' + (436 - h) + 'px; height: ' + h + 'px;', d: (i * 0.2 - 1.6).toFixed(1) }));
    return { steps };
  }
}
</script>
</body>
</html>
