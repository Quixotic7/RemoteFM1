<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CC bank</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.px{clip-path:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px))}
.lcd{position:absolute;left:0;top:0;width:480px;height:480px;pointer-events:none;background-image:linear-gradient(rgba(0,0,0,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.2) 1px,transparent 1px);background-size:4px 4px}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; background: #000000; font-family: 'Jersey 10', monospace; color: #f4f4f4; overflow: hidden; -webkit-font-smoothing: none; font-synthesis: none">
  <div style="position: absolute; left: 26px; top: 18px; width: 428px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{banks}}" as="b" hint-placeholder-count="5">
      <div class="px" style="position: relative; height: 56px; background: {{b.line}}">
        <div class="px" style="position: absolute; left: 4px; top: 4px; right: 4px; bottom: 4px; background: {{b.bg}}; color: {{b.fg}}; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700">{{b.name}}</div>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 36px; top: 92px; width: 408px; height: 372px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{cc}}" as="c" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <div style="font-size: 32px; font-weight: 700; line-height: 1">{{c.val}}</div>
        <div style="width: 100%; display: flex; flex-direction: column-reverse; gap: 4px">
          <sc-for list="{{c.segs}}" as="s" hint-placeholder-count="14">
            <div style="height: 14px; background: {{s.bg}}"></div>
          </sc-for>
        </div>
        <div class="px" style="padding: 7px 8px 5px; background: {{c.color}}; color: #000000; font-size: 26px; font-weight: 700; line-height: 1">{{c.num}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const banks = ['A', 'B', 'C', 'D', 'E'].map((n) => n === 'B'
      ? { name: n, line: '#f4f4f4', bg: '#f4f4f4', fg: '#000000' }
      : { name: n, line: '#333c57', bg: '#000000', fg: '#94b0c2' });
    const col = ['#41a6f6', '#ef7d57', '#ffcd75', '#a7f070'];
    const data = [[71, 40], [74, 96], [73, 12], [72, 64]];
    const cc = data.map((d, i) => {
      const lit = Math.round((d[1] / 127) * 14), segs = [];
      for (let s = 0; s < 14; s++) segs.push({ bg: s < lit ? col[i] : '#29366f' });
      return { num: 'CC' + d[0], val: d[1], color: col[i], segs };
    });
    return { banks, cc };
  }
}
</script>
</body>
</html>
