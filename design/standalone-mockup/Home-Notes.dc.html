<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home: notes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.px{clip-path:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px))}
.lcd{position:absolute;left:0;top:0;width:480px;height:480px;pointer-events:none;background-image:linear-gradient(rgba(0,0,0,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.2) 1px,transparent 1px);background-size:4px 4px}
@keyframes eq{0%{height:16px}50%{height:88px}100%{height:16px}}
.eq{animation:eq 1s steps(5) infinite}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.chord{animation:pop .3s steps(3) both}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; background: #000000; font-family: 'Jersey 10', monospace; color: #f4f4f4; overflow: hidden; -webkit-font-smoothing: none; font-synthesis: none">
  <div class="px" style="position: absolute; left: 20px; top: 16px; padding: 8px 14px 6px; background: #73eff7; color: #000000; font-size: 32px; font-weight: 700; line-height: 1">CH 01</div>
  <div class="px" style="position: absolute; right: 20px; top: 16px; padding: 8px 14px 6px; background: #333c57; font-size: 32px; font-weight: 700; line-height: 1">E.PIANO 1</div>
  <div class="chord" style="position: absolute; left: 0; right: 0; top: 92px; text-align: center; font-size: 136px; font-weight: 700; line-height: 1; text-shadow: 8px 8px 0 #5d275d">Dm<span style="color: #ef7d57">7</span></div>
  <div style="position: absolute; left: 0; right: 0; top: 262px; display: flex; justify-content: center; gap: 12px">
    <div class="px" style="padding: 8px 12px 6px; background: #333c57; font-size: 30px; font-weight: 700; line-height: 1">D4</div>
    <div class="px" style="padding: 8px 12px 6px; background: #333c57; font-size: 30px; font-weight: 700; line-height: 1">F4</div>
    <div class="px" style="padding: 8px 12px 6px; background: #333c57; font-size: 30px; font-weight: 700; line-height: 1">A4</div>
    <div class="px" style="padding: 8px 12px 6px; background: #ef7d57; color: #000000; font-size: 30px; font-weight: 700; line-height: 1">C5</div>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; bottom: 20px; height: 96px; display: flex; gap: 8px; align-items: flex-end">
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="14">
      <div class="eq" style="flex: 1; height: 16px; background: {{b.bg}}; animation-delay: {{b.d}}s; animation-duration: {{b.t}}s"></div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const bars = [];
    for (let i = 0; i < 14; i++) bars.push({ bg: i % 2 ? '#ffcd75' : '#ef7d57', d: (-((i * 37) % 10) / 10).toFixed(1), t: (0.8 + ((i * 13) % 6) / 10).toFixed(1) });
    return { bars };
  }
}
</script>
</body>
</html>
