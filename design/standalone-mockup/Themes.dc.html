<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The eight themes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.px{clip-path:polygon(0 4px,2px 4px,2px 2px,4px 2px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px))}
</style>
</helmet>
<div style="width: 1120px; height: 660px; box-sizing: border-box; padding: 20px; background: #000000; font-family: 'Jersey 10', monospace; color: #f4f4f4; -webkit-font-smoothing: none; font-synthesis: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 40px; row-gap: 32px">
  <sc-for list="{{themes}}" as="t" hint-placeholder-count="8">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="width: 240px; height: 240px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; box-shadow: inset 0 0 0 8px {{t.border}}; outline: 2px solid #26262d">
        <div class="px" style="position: absolute; left: 16px; top: 14px; padding: 4px 8px 2px; background: {{t.a2}}; color: {{t.on}}; font-size: 18px; line-height: 1">CH 01</div>
        <div class="px" style="position: absolute; right: 16px; top: 14px; padding: 4px 8px 2px; background: {{t.panel}}; color: {{t.ink}}; font-size: 18px; line-height: 1">E.PIANO 1</div>
        <div style="position: absolute; left: 0; right: 0; top: 52px; text-align: center; font-size: 96px; line-height: 1; text-shadow: 5px 5px 0 {{t.shadow}}">Dm<span style="color: {{t.a1}}">7</span></div>
        <div style="position: absolute; left: 0; right: 0; top: 160px; display: flex; justify-content: center; gap: 6px">
          <div class="px" style="padding: 4px 6px 2px; background: {{t.panel}}; font-size: 20px; line-height: 1">D4</div>
          <div class="px" style="padding: 4px 6px 2px; background: {{t.panel}}; font-size: 20px; line-height: 1">F4</div>
          <div class="px" style="padding: 4px 6px 2px; background: {{t.panel}}; font-size: 20px; line-height: 1">A4</div>
          <div class="px" style="padding: 4px 6px 2px; background: {{t.a1}}; color: {{t.on}}; font-size: 20px; line-height: 1">C5</div>
        </div>
        <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 20px; display: flex; gap: 4px">
          <div style="flex: 1; background: {{t.a2}}"></div>
          <div style="flex: 1; background: {{t.a1}}"></div>
          <div style="flex: 1; background: {{t.a3}}"></div>
          <div style="flex: 1; background: {{t.a4}}"></div>
        </div>
      </div>
      <div style="font-size: 30px; line-height: 1">{{t.name}}</div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":660}}'>
class Component extends DCLogic {
  renderVals() {
    const themes = [
      { name: 'ChoralRoot', bg: '#000000', border: '#000000', panel: '#1c1c1c', ink: '#f4f1ea', a1: '#ff8a1f', a2: '#4d7cff', a3: '#ffd60a', a4: '#2fd27f', shadow: '#2a2a2a', on: '#000000' },
      { name: 'FIZZ', bg: '#000000', border: '#000000', panel: '#26262d', ink: '#f1f0ea', a1: '#ff6a2c', a2: '#3f7dff', a3: '#ffd23f', a4: '#1fd47e', shadow: '#f03cff', on: '#000000' },
      { name: 'NES', bg: '#000000', border: '#000000', panel: '#0000bc', ink: '#f8f8f8', a1: '#f83800', a2: '#3cbcfc', a3: '#f8b800', a4: '#58d854', shadow: '#0000bc', on: '#000000' },
      { name: 'C64', bg: '#000000', border: '#6c5eb5', panel: '#352879', ink: '#ffffff', a1: '#9ad284', a2: '#70a4b2', a3: '#b8c76f', a4: '#9a6759', shadow: '#352879', on: '#000000' },
      { name: 'C64 Impossible Mission', bg: '#000000', border: '#000000', panel: '#a1683c', ink: '#ffffff', a1: '#edf171', a2: '#75cec8', a3: '#c46c71', a4: '#a9ff9f', shadow: '#8e3c97', on: '#000000' },
      { name: 'SNES', bg: '#000000', border: '#9a97b5', panel: '#4f43ae', ink: '#e6e4f0', a1: '#d8343c', a2: '#4a6cd8', a3: '#f4c20d', a4: '#2fa35c', shadow: '#4f43ae', on: '#000000' },
      { name: 'Game Boy', bg: '#000000', border: '#306230', panel: '#306230', ink: '#9bbc0f', a1: '#8bac0f', a2: '#9bbc0f', a3: '#8bac0f', a4: '#306230', shadow: '#0f380f', on: '#000000' },
      { name: 'SynthWave', bg: '#000000', border: '#000000', panel: '#2e1a5e', ink: '#ffffff', a1: '#ff2e97', a2: '#00e5ff', a3: '#ffe45e', a4: '#b84dff', shadow: '#ff2e97', on: '#000000' },
    ];
    return { themes };
  }
}
</script>
</body>
</html>
