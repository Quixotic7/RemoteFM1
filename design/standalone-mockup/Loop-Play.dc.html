<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loop playing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.px{clip-path:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px))}
.lcd{position:absolute;left:0;top:0;width:480px;height:480px;pointer-events:none;background-image:linear-gradient(rgba(0,0,0,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.2) 1px,transparent 1px);background-size:4px 4px}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.reel{animation:spin .8s steps(4) infinite;transform-origin:36px 36px}
@keyframes fill{from{width:0}to{width:428px}}
.prog{animation:fill 4.2s steps(24) infinite}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; background: #000000; font-family: 'Jersey 10', monospace; color: #f4f4f4; overflow: hidden; -webkit-font-smoothing: none; font-synthesis: none">
  <div class="px" style="position: absolute; left: 20px; top: 16px; padding: 8px 14px 6px; background: #a7f070; color: #000000; font-size: 32px; font-weight: 700; line-height: 1">PLAY</div>
  <div class="px" style="position: absolute; right: 20px; top: 16px; padding: 8px 14px 6px; background: #333c57; font-size: 32px; font-weight: 700; line-height: 1">4.2S</div>
  <div class="px" style="position: absolute; left: 56px; top: 80px; width: 368px; height: 256px; background: #566c86"></div>
  <div class="px" style="position: absolute; left: 80px; top: 100px; width: 320px; height: 60px; background: #f4f4f4; color: #000000; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700">LOOP 3</div>
  <div style="position: absolute; left: 80px; top: 164px; width: 320px; height: 8px; background: #b13e53"></div>
  <div class="px" style="position: absolute; left: 128px; top: 184px; width: 224px; height: 88px; background: #000000"></div>
  <svg class="reel" width="72" height="72" viewBox="0 0 72 72" shape-rendering="crispEdges" style="position: absolute; left: 140px; top: 192px" aria-hidden="true">
    <path d="{{reel.a}}" fill="#f4f4f4"></path>
    <path d="{{reel.b}}" fill="#000000"></path>
  </svg>
  <svg class="reel" width="72" height="72" viewBox="0 0 72 72" shape-rendering="crispEdges" style="position: absolute; left: 268px; top: 192px" aria-hidden="true">
    <path d="{{reel.a}}" fill="#f4f4f4"></path>
    <path d="{{reel.b}}" fill="#000000"></path>
  </svg>
  <div style="position: absolute; left: 212px; top: 220px; width: 56px; height: 16px; background: #5d275d"></div>
  <div class="px" style="position: absolute; left: 136px; top: 288px; width: 208px; height: 48px; background: #333c57"></div>
  <div style="position: absolute; left: 172px; top: 304px; width: 16px; height: 16px; background: #000000"></div>
  <div style="position: absolute; left: 292px; top: 304px; width: 16px; height: 16px; background: #000000"></div>
  <div style="position: absolute; left: 26px; top: 380px; width: 428px; height: 32px; background: #29366f">
    <div class="prog" style="height: 32px; background: #a7f070"></div>
    <div style="position: absolute; left: 0; top: 0; width: 428px; height: 32px; background: repeating-linear-gradient(90deg, transparent 0 14px, #000000 14px 18px)"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const spr = (rows, s) => { const o = {}; rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) { const c = r[x]; if (c === '.') continue; o[c] = (o[c] || '') + 'M' + x * s + ' ' + y * s + 'h' + s + 'v' + s + 'h-' + s + 'z'; } }); return o; };
    const reel = spr([
      '....aaaa....',
      '..aaaaaaaa..',
      '.aabaaaaaaa.',
      '.abbaaaaaaa.',
      'aaaaabbaaaaa',
      'aaaabbbbaaaa',
      'aaaabbbbaaaa',
      'aaaaabbaaaaa',
      '.aaaaaaaaaa.',
      '.aaaaaaaaaa.',
      '..aaaaaaaa..',
      '....aaaa....',
    ], 6);
    return { reel };
  }
}
</script>
</body>
</html>
